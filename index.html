<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Habits</title>
  <meta name="description" content="A simple, private daily habit tracker. Check in, build streaks.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-text">
        <h1>Daily Habits</h1>
        <p class="date-line" id="dateLine"></p>
      </div>
      <div class="ring-wrap" id="dayRing" aria-label="Today's progress"></div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-tab="checkin" type="button"><span class="tab-ico">✓</span><span>Check-in</span></button>
      <button class="tab" data-tab="calendar" type="button"><span class="tab-ico">📅</span><span>Calendar</span></button>
      <button class="tab" data-tab="more" type="button"><span class="tab-ico">⚙️</span><span>More</span></button>
    </nav>
  </div>

  <input type="file" id="importFile" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
