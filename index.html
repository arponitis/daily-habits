<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Habits</title>
  <meta name="description" content="A simple, private daily habit tracker. Check in, build streaks.">
  <meta name="theme-color" content="#4f46e5">
  <script>
  /* Apply the saved theme before first paint to avoid a flash. */
  try {
    var __t = localStorage.getItem('daily-habits/theme') || 'auto';
    var __d = __t === 'dark' || (__t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', __d ? 'dark' : 'light');
  } catch (e) {}
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-text">
        <h1>Daily Habits</h1>
        <p class="date-line" id="dateLine"></p>
        <span id="offlinePill" class="offline-pill" hidden>Offline</span>
      </div>
      <div class="ring-wrap" id="dayRing" aria-label="Today's progress"></div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-tab="checkin" type="button"><span class="tab-ico">✓</span><span>Check-in</span></button>
      <button class="tab" data-tab="calendar" type="button"><span class="tab-ico">📅</span><span>Calendar</span></button>
      <button class="tab" data-tab="stats" type="button"><span class="tab-ico">📊</span><span>Stats</span></button>
      <button class="tab" data-tab="more" type="button"><span class="tab-ico">⚙️</span><span>More</span></button>
    </nav>
  </div>

  <input type="file" id="importFile" accept="application/json" hidden>
  <input type="file" id="importEncFile" accept="application/json,.enc.json" hidden>
  <div id="toast" class="toast" hidden></div>
  <script src="js/lib/dates.js"></script>
  <script src="js/lib/schedule.js"></script>
  <script src="js/lib/streaks.js"></script>
  <script src="js/lib/heatmap.js"></script>
  <script src="js/lib/trends.js"></script>
  <script src="js/lib/insights.js"></script>
  <script src="js/lib/crypto.js"></script>
  <script src="js/lib/merge.js"></script>
  <script src="js/lib/templates.js"></script>
  <script src="js/lib/schema.js"></script>
  <script src="js/store/db.js"></script>
  <script src="js/sync/client.js"></script>
  <script src="js/app/state.js"></script>
  <script src="js/app/checkin.js"></script>
  <script src="js/app/sheet.js"></script>
  <script src="js/app/stats.js"></script>
  <script src="js/app/calendar.js"></script>
  <script src="js/app/more.js"></script>
  <script src="js/app/editor.js"></script>
  <script src="js/app/reminders.js"></script>
  <script src="js/app/sync-ui.js"></script>
  <script src="js/app/templates-ui.js"></script>
  <script src="js/app/onboarding.js"></script>
  <script src="js/app/shell.js"></script>
</body>
</html>
