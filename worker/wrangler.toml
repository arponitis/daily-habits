name = "daily-habits-push"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"] # web-push needs node:crypto

# Created by `wrangler kv namespace create REMINDERS` during setup -
# paste the returned id here.
[[kv_namespaces]]
binding = "REMINDERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Public VAPID key (same value as VAPID_PUBLIC_KEY in app.js).
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"

[triggers]
crons = ["*/10 * * * *"]
